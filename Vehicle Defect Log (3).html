<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vehicle Defect Log</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mu:#6b7280;--bd:#e2e5ea;--ac:#e8590c;--acx:#fff;--lo:#2f9e44;--me:#f59f00;--hi:#e03131;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mu:#98a1ad;--bd:#2c333d}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mu:#98a1ad;--bd:#2c333d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.sev button{flex:1;padding:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.sev button.on[data-s=Low]{border-color:var(--lo);background:var(--lo);color:#fff}
.sev button.on[data-s=Medium]{border-color:var(--me);background:var(--me);color:#000}
.sev button.on[data-s=High]{border-color:var(--hi);background:var(--hi);color:#fff}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font:inherit;font-weight:700;margin-top:12px;cursor:pointer}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd);margin-top:0}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:2px dashed var(--bd);border-radius:10px;cursor:pointer;color:var(--mu);font-weight:600}
.pick input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img,.ph img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}
.item{border-top:1px solid var(--bd);padding:12px 0}.item:first-child{border-top:0}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;font-size:13px;color:var(--mu)}
.badge{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.badge.Low{background:var(--lo)}.badge.Medium{background:var(--me);color:#000}.badge.High{background:var(--hi)}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.del{background:none;border:0;color:var(--hi);font:inherit;font-size:13px;padding:4px 0;cursor:pointer}
.empty{color:var(--mu);text-align:center;padding:18px 0}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>🔧 Vehicle Defect Log</h1>

<section class="card">
<h2>New defect</h2>
<label for="veh">VIN</label>
<input id="veh" placeholder="e.g. 1HGCM82633A004352" autocapitalize="characters" list="vlist"><datalist id="vlist"></datalist>
<label for="ro">RO number</label>
<input id="ro" placeholder="e.g. 48213" autocapitalize="characters">
<label>VIN photo (required)</label>
<label class="pick">📷 Photo of VIN plate<input id="vinf" type="file" accept="image/*" capture="environment"></label>
<div class="thumbs" id="vinp"></div>
<label>KM photo (required)</label>
<label class="pick">📷 Photo of odometer<input id="kmf" type="file" accept="image/*" capture="environment"></label>
<div class="thumbs" id="kmp"></div>
<div class="row">
<div><label for="area">Location</label>
<select id="area"><option>Front bumper</option><option>Rear bumper</option><option>Driver side</option><option>Passenger side</option><option>Bonnet / hood</option><option>Roof</option><option>Windscreen / glass</option><option>Wheels / tyres</option><option>Lights</option><option>Interior</option><option>Underbody</option><option>Engine bay</option><option>Other</option></select></div>
<div><label for="type">Type</label>
<select id="type"><option>Dent</option><option>Scratch</option><option>Crack</option><option>Rust</option><option>Leak</option><option>Broken part</option><option>Wear</option><option>Other</option></select></div>
</div>
<label>Severity</label>
<div class="row sev" id="sev"><button data-s="Low" type="button">Low</button><button data-s="Medium" type="button" class="on">Medium</button><button data-s="High" type="button">High</button></div>
<label for="notes">Notes</label>
<textarea id="notes" placeholder="Describe the defect…"></textarea>
<label>Photos</label>
<label class="pick">📷 Take or choose photos<input id="file" type="file" accept="image/*" capture="environment" multiple></label>
<div class="thumbs" id="prev"></div>
<button class="btn" id="save" type="button">Save defect</button>
</section>

<section class="card">
<h2>Logged defects</h2>
<select id="filter" aria-label="Filter by RO number"></select>
<div id="list"></div>
<button class="btn" id="email" type="button">✉️ Email report with photos</button>
<div id="emsg" class="empty" style="padding:6px 0 0;font-size:13px"></div>
<button class="btn sec" id="copy" type="button" style="margin-top:10px">Copy report as text</button>
</section>
</main>
<div id="lb"><img alt=""></div>

<script>
let items=[],pending=[],sev="Medium",db=null,vinPhoto=null,kmPhoto=null,lastVin="";
const $=id=>document.getElementById(id);

function openDB(){return new Promise(res=>{try{const r=indexedDB.open("defectlog",1);
r.onupgradeneeded=()=>r.result.createObjectStore("items",{keyPath:"id"});
r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null)}})}
function tx(mode,fn){return new Promise(res=>{if(!db)return res([]);try{const t=db.transaction("items",mode),rq=fn(t.objectStore("items"));
t.oncomplete=()=>res(rq&&rq.result||[]);t.onerror=()=>res([]);}catch(e){res([])}})}

function shrink(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();
im.onload=()=>{const m=1280,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.78))};
im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(t){return new Date(t).toLocaleString([],{dateStyle:"medium",timeStyle:"short"})}

function render(){
  const vs=[...new Set(items.map(i=>i.veh))].sort(),ros=[...new Set(items.map(i=>i.ro).filter(Boolean))].sort(),cur=$("filter").value||"";
  $("filter").innerHTML='<option value="">All ROs ('+items.length+')</option>'+ros.map(v=>`<option ${v===cur?"selected":""}>${esc(v)}</option>`).join("");
  $("vlist").innerHTML=vs.map(v=>`<option value="${esc(v)}">`).join("");
  const f=$("filter").value,show=items.filter(i=>!f||i.ro===f).sort((a,b)=>b.ts-a.ts);
  $("list").innerHTML=show.length?show.map(i=>`<div class="item"><div class="meta"><b style="color:var(--tx)">${esc(i.veh)}</b>${i.ro?`<span>RO ${esc(i.ro)}</span>`:""}<span class="badge ${i.sev}">${i.sev}</span><span>${esc(i.type)} · ${esc(i.area)}</span></div>
  ${i.notes?`<div>${esc(i.notes)}</div>`:""}<div class="ph">${[["VIN",i.vinPhoto],["KM",i.kmPhoto]].map(x=>x[1]?`<figure style="margin:0;text-align:center;font-size:11px;color:var(--mu)"><img src="${x[1]}" data-id="${i.id}" data-n="${x[0].toLowerCase()}" alt="${x[0]} photo">${x[0]}</figure>`:"").join("")}${i.photos.map((p,n)=>`<img src="${p}" data-id="${i.id}" data-n="${n}" alt="Defect photo">`).join("")}</div>
  <div class="meta">${fmt(i.ts)} <button class="del" data-del="${i.id}">Delete</button></div></div>`).join(""):'<div class="empty">No defects logged yet.</div>';
}
function prev(){$("prev").innerHTML=pending.map((p,n)=>`<img src="${p}" data-p="${n}" alt="Pending photo">`).join("")}

$("sev").onclick=e=>{const b=e.target.closest("button");if(!b)return;sev=b.dataset.s;[...$("sev").children].forEach(x=>x.classList.toggle("on",x===b))};
$("file").onchange=async e=>{for(const f of e.target.files){const d=await shrink(f);if(d)pending.push(d)}e.target.value="";prev()};
$("prev").onclick=e=>{const n=e.target.dataset.p;if(n!==undefined){pending.splice(+n,1);prev()}};
$("save").onclick=async()=>{
  const veh=$("veh").value.trim().toUpperCase();
  if(!veh){$("veh").focus();return}
  if(!vinPhoto||!kmPhoto){alert("A VIN photo and a KM photo are required before saving.");return}
  if(!pending.length&&!$("notes").value.trim()){alert("Add at least a photo or a note.");return}
  const it={id:Date.now()+"-"+Math.random().toString(36).slice(2,6),veh,ro:$("ro").value.trim().toUpperCase(),vinPhoto,kmPhoto,area:$("area").value,type:$("type").value,sev,notes:$("notes").value.trim(),photos:pending,ts:Date.now()};
  items.push(it);await tx("readwrite",s=>s.put(it));
  pending=[];$("notes").value="";prev();lastVin=veh;$("filter").value=it.ro;render();
};
$("filter").onchange=render;
$("list").onclick=async e=>{
  const d=e.target.dataset;
  if(d.del&&confirm("Delete this defect?")){items=items.filter(i=>i.id!==d.del);await tx("readwrite",s=>s.delete(d.del));render()}
  else if(d.id){const it=items.find(i=>i.id===d.id);$("lb").firstElementChild.src=(d.n==="vin"?it.vinPhoto:d.n==="km"?it.kmPhoto:it.photos[+d.n]);$("lb").style.display="flex"}
};
$("lb").onclick=()=>$("lb").style.display="none";
$("copy").onclick=async()=>{
  const f=$("filter").value,t=items.filter(i=>!f||i.ro===f).sort((a,b)=>a.ts-b.ts)
   .map(i=>`${i.veh}${i.ro?" | RO "+i.ro:""} | ${fmt(i.ts)} | ${i.sev} | ${i.type} - ${i.area}${i.notes?" | "+i.notes:""} | ${i.photos.length} photo(s)`).join("\n");
  try{await navigator.clipboard.writeText(t||"No defects logged.");$("copy").textContent="Copied ✓"}catch(e){$("copy").textContent="Copy not available"}
  setTimeout(()=>$("copy").textContent="Copy report as text",1800);
};

function toFile(d,name){const b=atob(d.split(",")[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new File([a],name,{type:"image/jpeg"})}
$("email").onclick=async()=>{
  const f=$("filter").value,list=items.filter(i=>!f||i.ro===f).sort((a,b)=>a.ts-b.ts),m=$("emsg");
  if(!list.length){m.textContent="Nothing to send yet.";return}
  const files=[],lines=list.map((i,n)=>{const ex=[["VIN",i.vinPhoto],["KM",i.kmPhoto]].filter(x=>x[1]).map(x=>{const nm=`${i.veh}-defect${n+1}-${x[0]}.jpg`;files.push(toFile(x[1],nm));return nm});const names=ex.concat(i.photos.map((p,k)=>{const nm=`${i.veh}-defect${n+1}-photo${k+1}.jpg`;files.push(toFile(p,nm));return nm}));
    return `${n+1}. ${i.veh}${i.ro?" | RO "+i.ro:""} | ${fmt(i.ts)} | ${i.sev} | ${i.type} - ${i.area}${i.notes?" | "+i.notes:""}${names.length?"\n   Photos: "+names.join(", "):""}`});
  const subject="Vehicle defect report"+(f?" - RO "+f:""),body=subject+"\n\n"+lines.join("\n\n");
  try{
    if(navigator.canShare&&navigator.canShare({files})){await navigator.share({title:subject,text:body,files});m.textContent="";return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const txt=body.length>1800?body.slice(0,1800)+"…":body;
  location.href="mailto:?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(txt);
  m.textContent="This device can't attach photos from here, so the email has the text only. Try on your phone, or attach photos manually.";
};

function showSingles(){$("vinp").innerHTML=vinPhoto?`<img src="${vinPhoto}" alt="VIN photo">`:"";$("kmp").innerHTML=kmPhoto?`<img src="${kmPhoto}" alt="KM photo">`:""}
$("vinf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(f){const d=await shrink(f);if(d)vinPhoto=d;showSingles()}};
$("kmf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(f){const d=await shrink(f);if(d)kmPhoto=d;showSingles()}};
$("veh").onchange=()=>{if(lastVin&&$("veh").value.trim().toUpperCase()!==lastVin){vinPhoto=kmPhoto=null;showSingles()}};

(async()=>{db=await openDB();items=await tx("readonly",s=>s.getAll());render()})();
</script>
</body>
</html>
